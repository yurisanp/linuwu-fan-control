# ══════════════════════════════════════════════════════════════════════════════
# linuwu-fan-control.conf
# Controle de ventoinhas para Acer Predator (driver Linuwu-Sense)
#
# Após editar, o daemon recarrega automaticamente na próxima leitura.
# Para aplicar imediatamente: sudo systemctl restart linuwu-fan-control
# ══════════════════════════════════════════════════════════════════════════════

[general]
# Liga ou desliga o controle customizado.
# false → ventoinhas voltam ao controle automático do firmware (fan=0)
enabled = true

# Intervalo entre leituras (segundos). Valores menores = mais responsivo,
# porém mais uso de CPU. Recomendado: 2–4.
poll_interval = 2

# Máxima variação de velocidade por ciclo (%).
# Valores menores = transições mais suaves, porém mais lentas.
# Ex: ramp_step=5 com poll_interval=2 → leva ~10s para subir 50%.
ramp_step = 5

# Zona morta antes de REDUZIR a ventoinha (%).
# Evita que as ventoinhas fiquem oscilando quando a temp flutua pouco.
# Ex: hysteresis=4 → só reduz se o alvo cair mais de 4% abaixo da velocidade atual.
hysteresis = 4

# ──────────────────────────────────────────────────────────────────────────────
[power]
# META DE CONSUMO EM ALTA CARGA (watts)
# Quando o CPU ultrapassar este valor, as ventoinhas recebem um boost extra
# proporcional ao excesso. Isso ajuda a manter o TDP dentro do esperado.
# Ex: i7-4790 tem TDP oficial de 88W; valores entre 45–70W são razoáveis
# para carga sustentada sem barulho excessivo.
target_watts = 50

# Curva de velocidade baseada em potência total (CPU + GPU) em watts.
# Formato: watts:fan_speed, watts:fan_speed, ...
# O daemon interpola linearmente entre os pontos.
#
#  Watts │ Fan %
# ───────┼──────
#    15  │  15     (idle/leve)
#    25  │  28
#    35  │  40
#    50  │  58     (target_watts → ventoinhas já bem ativas)
#    70  │  75
#    90  │  90
#   110  │ 100
curve = 15:15, 25:28, 35:40, 50:58, 70:75, 90:90, 110:100

# ──────────────────────────────────────────────────────────────────────────────
[cpu_temp]
# Curva de velocidade baseada na temperatura do pacote CPU (°C).
# Ajuste conforme seu perfil de ruído/temperatura preferido.
#
#  Temp °C │ Fan %
# ─────────┼──────
#    45    │  20
#    55    │  35
#    65    │  50
#    75    │  68
#    85    │  88
#    95    │ 100
curve = 45:20, 55:35, 65:50, 75:68, 85:88, 95:100

# ──────────────────────────────────────────────────────────────────────────────
[gpu_temp]
# Curva de velocidade baseada na temperatura da GPU (AMD RX 5500 XT).
# A GPU tende a aquecer mais sob jogos; pode usar uma curva mais agressiva.
#
#  Temp °C │ Fan %
# ─────────┼──────
#    45    │  20
#    55    │  33
#    65    │  48
#    75    │  65
#    85    │  85
#    95    │ 100
curve = 45:20, 55:33, 65:48, 75:65, 85:85, 95:100

# ──────────────────────────────────────────────────────────────────────────────
[limits]
# Velocidade mínima e máxima permitidas (%).
# cpu_fan_min = 0 significa que em idle as ventoinhas podem parar (se a curva
# permitir). Coloque um valor como 15 para garantir algum fluxo sempre.
cpu_fan_min = 0
cpu_fan_max = 100
gpu_fan_min = 0
gpu_fan_max = 100
