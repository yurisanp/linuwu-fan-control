# ══════════════════════════════════════════════════════════════════════════════
# linuwu-fan-control.profiles.conf
# Perfis predefinidos para o linuwu-fan-control.
#
# Cada perfil é uma seção [profile:NOME]. As chaves usam o formato canônico
# "section.key = value" (mesma convenção do `linuwu-fan-ctl set`). Aplicar um
# perfil copia esses valores para /etc/linuwu-fan-control.conf e recarrega o
# daemon. O daemon NÃO lê este arquivo — apenas o linuwu-fan-ctl / a tray.
#
# Aplicar:   sudo linuwu-fan-ctl apply-profile gaming
#            (ou pela bandeja KDE / automaticamente via GameMode)
# Listar:    linuwu-fan-ctl list-profiles
#
# Um perfil pode definir só as chaves que quer mudar; as demais permanecem.
# ══════════════════════════════════════════════════════════════════════════════

# ── default ───────────────────────────────────────────────────────────────────
# Perfil equilibrado para o dia a dia. É o estado de "retorno" após o jogo.
[profile:default]
general.enabled    = true
power.target_watts = 50
power.curve        = 15:15, 25:28, 35:40, 50:58, 70:75, 90:90, 110:100
cpu_temp.curve     = 45:20, 55:35, 65:50, 75:68, 85:88, 95:100
gpu_temp.curve     = 45:20, 55:33, 65:48, 75:65, 85:85, 95:100
limits.cpu_fan_min = 0
limits.gpu_fan_min = 0
limits.cpu_fan_max = 100
limits.gpu_fan_max = 100

# ── gaming ────────────────────────────────────────────────────────────────────
# Resfriamento agressivo: curvas mais altas, target_watts maior e um piso de
# ventoinha para garantir fluxo de ar constante sob carga. Ativado
# automaticamente quando o Feral GameMode (gamemoderun) entra em ação.
[profile:gaming]
general.enabled    = true
power.target_watts = 70
power.curve        = 15:25, 25:40, 35:55, 50:70, 70:85, 90:95, 110:100
cpu_temp.curve     = 40:30, 50:45, 60:60, 70:78, 80:92, 90:100
gpu_temp.curve     = 40:30, 50:45, 60:62, 70:80, 80:95, 90:100
limits.cpu_fan_min = 30
limits.gpu_fan_min = 30
limits.cpu_fan_max = 100
limits.gpu_fan_max = 100

# ── silent ────────────────────────────────────────────────────────────────────
# Prioriza silêncio: curvas suaves, teto de ventoinha reduzido e target_watts
# baixo. Pode permitir temperaturas mais altas em troca de menos ruído.
[profile:silent]
general.enabled    = true
power.target_watts = 40
power.curve        = 20:0, 35:18, 50:35, 70:55, 90:70, 110:80
cpu_temp.curve     = 50:0, 60:20, 70:38, 80:55, 90:70, 95:80
gpu_temp.curve     = 50:0, 60:20, 70:38, 80:55, 90:70, 95:80
limits.cpu_fan_min = 0
limits.gpu_fan_min = 0
limits.cpu_fan_max = 80
limits.gpu_fan_max = 80
