# dkms.conf — registra o módulo linuwu_sense no DKMS para recompilação
# automática a cada atualização de kernel.
#
# Build feito com LLVM=1 (kernels CachyOS/Arch-zen compilados com Clang exigem
# o módulo compilado com a mesma toolchain). Chamamos o target "modules"
# diretamente — NÃO o "all" do Makefile — para não disparar o bloco de
# assinatura do projeto (que depende de $HOME); a assinatura, quando há Secure
# Boot, é feita pelo DKMS via /etc/dkms/framework.conf (configurado no install.sh).
PACKAGE_NAME="linuwu_sense"
PACKAGE_VERSION="1.0"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 clean"

BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

AUTOINSTALL="yes"
